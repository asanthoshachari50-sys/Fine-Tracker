<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Glowing background aura -->
  <circle cx="256" cy="256" r="140" fill="#10b981" opacity="0.12" filter="url(#glow)"/>

  <!-- Circular progress track -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1e293b" stroke-width="20"/>
  <!-- Progress arc -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#emeraldGrad)" stroke-width="20" stroke-linecap="round" stroke-dasharray="750 1005" transform="rotate(-90 256 256)"/>

  <!-- Central Pulse / Finance Icon -->
  <!-- Wallet / Vault base -->
  <g transform="translate(136, 146)">
    <!-- Credit / Calculator Card -->
    <rect x="20" y="30" width="200" height="150" rx="28" fill="#0f172a" stroke="url(#tealGrad)" stroke-width="12"/>
    <!-- Card Chip / Coin -->
    <circle cx="80" cy="85" r="24" fill="url(#emeraldGrad)"/>
    <path d="M72 85h16M80 77v16" stroke="#020617" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Pulse Line across card -->
    <path d="M120 120 l20 -35 l20 50 l25 -25 l15 10" fill="none" stroke="#34d399" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
